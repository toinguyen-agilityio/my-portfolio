name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      contains(fromJSON('["toinguyen-agilityio","huypham-agilityio"]'), github.actor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          # Each user pays with their own token; an unknown or missing token resolves to ''
          claude_code_oauth_token: ${{
            github.actor == 'toinguyen-agilityio' && secrets.CLAUDE_CODE_OAUTH_TOKEN ||
            github.actor == 'huypham-agilityio' && secrets.CLAUDE_CODE_OAUTH_MAINTAINER_TOKEN ||
            '' }}
          # Inline comments open review threads, which "Require conversation resolution" blocks merge on
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Focus on bugs, security, and the conventions in CONTRIBUTING.md.
            Post every finding as an INLINE comment on the exact line.
            Keep each comment to 10-30 words, in this shape:
              Don't <what is wrong>. Do <one suggestion> instead, because <one reason>.
            One issue per comment. No headings, no praise, no restating the code.
            Add a ```suggestion block only when the fix is a few lines.
            Skip nitpicks that lint or prettier already catch.
            Do not repeat issues that already have a comment.
            End with one summary comment of at most 3 lines.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
